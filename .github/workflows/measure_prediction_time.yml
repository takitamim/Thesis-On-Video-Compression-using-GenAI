# =============================================================================
# Measure ConvLSTM-UNet prediction time on a cloud CPU (GitHub-hosted runner)
# =============================================================================
# How to run:
#   1. Push this repo to GitHub (private recommended)
#   2. Open the repo on github.com → Actions tab
#   3. Select "Measure Prediction Time (GOP-4)"
#   4. Click "Run workflow" → Run workflow
#   5. When finished, download the artifact "prediction-times-gop4"
# =============================================================================

name: Measure Prediction Time (GOP-4)

on:
  workflow_dispatch:   # manual run only (you click a button)

jobs:
  measure:
    name: Run calculate_prediction_time_gop4.py
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      THESIS_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          # torch only (script no longer needs torchvision)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Verify inputs exist
        run: |
          test -f best_model_gop4.pt
          test -d "Archive/VVC Reconstructed/New - All same resolution"
          python -c "import torch; print('torch', torch.__version__, 'cuda?', torch.cuda.is_available())"
          python -c "import calculate_prediction_time_gop4; print('script import OK')"

      - name: Measure prediction times (GOP-4)
        run: python calculate_prediction_time_gop4.py

      - name: Upload prediction_times.csv
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-times-gop4
          path: Archive/Class Prediction Time GOP4/prediction_times.csv
          if-no-files-found: warn
